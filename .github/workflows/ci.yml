name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (NumPy-only surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
      - name: Install deps
        run: |
          poetry env use 3.11
          poetry install
      - name: Pre-commit
        run: poetry run pre-commit run --all-files
      - name: Tests
        run: poetry run pytest --cov=src --cov-report=xml --cov-report=term
      - name: CLI smoke
        run: |
          # `poetry run`: the bare interpreter has no numpy, only the venv does.
          poetry run python - <<'PY'
          import numpy as np
          np.save('series.npy', np.sin(np.linspace(0, 4*np.pi, 128)))
          PY
          poetry run tscv-features --encoders gaf --input series.npy --output out.npz
          poetry run tscv-features --encoders spec --sliding --win-len 64 --hop 32 --input series.npy --output out_sliding.npz
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage reporting is not a quality gate, and tokenless uploads are
          # rate-limited (HTTP 429), so a Codecov outage must not fail a build
          # whose tests passed. Set the CODECOV_TOKEN secret for reliable
          # uploads.
          fail_ci_if_error: false

  optional:
    # Runs the `optional` marker excluded from the default addopts. Without this
    # job a regression in the sklearn/torch/analytics integrations is invisible
    # to the primary quality signal.
    name: Optional integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
      - name: Install deps with optional extras
        run: |
          poetry env use 3.11
          poetry install --extras "cli analytics domains mlops"
          poetry run pip install torch --index-url https://download.pytorch.org/whl/cpu
          poetry run pip install onnx onnxruntime tensorflow-cpu
      - name: Optional-marked tests
        run: poetry run pytest -m optional -p no:randomly

  reference:
    # Numerical equivalence against authoritative implementations. Split from
    # `optional` so a heavyweight reference package cannot break the rest.
    name: Reference equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
      - name: Install reference implementations
        run: |
          poetry env use 3.11
          poetry install
          # kymatio 0.3.0 uses scipy.special.sph_harm, removed in SciPy 1.17.
          poetry run pip install "scipy<1.17" scikit-image scikit-learn pyts ripser persim stumpy kymatio
      - name: Equivalence tests
        run: |
          poetry run pytest -m optional tests/test_reference_equivalence.py -v
          poetry run pytest -m optional tests/test_scattering.py -v

  benchmark-smoke:
    # The UCR/UEA sweep itself runs offline (the archive is not redistributable),
    # but the harness must stay runnable so frozen results can be regenerated.
    name: Benchmark harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
      - name: Install deps
        run: |
          poetry env use 3.11
          poetry install --extras "domains"
      - name: Run harness on generated data
        run: |
          poetry run python -m tscv_vision.evaluation --synthetic \
            --methods baseline-1nn-euclidean baseline-raw-logreg gasf-features \
            --out "$RUNNER_TEMP/bench"
          test -s "$RUNNER_TEMP/bench/results.csv"
          test -s "$RUNNER_TEMP/bench/manifest.json"
          test -s "$RUNNER_TEMP/bench/summary.md"
