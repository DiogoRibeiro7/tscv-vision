name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
      - name: Install deps
        run: |
          poetry env use 3.11
          poetry install
      - name: Lint
        run: |
          poetry run ruff check .
          poetry run mypy src
      - name: Tests
        run: poetry run pytest -q
