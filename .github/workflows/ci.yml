name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
      - name: Install deps
        run: |
          poetry env use 3.11
          poetry install
      - name: Pre-commit
        run: poetry run pre-commit run --all-files
      - name: Tests
        run: poetry run pytest --cov=src --cov-report=xml --cov-report=term
      - name: CLI smoke
        run: |
          python - <<'PY'
          import numpy as np
          np.save('series.npy', np.sin(np.linspace(0, 4*np.pi, 128)))
          PY
          poetry run tscv-features --encoders gaf --input series.npy --output out.npz
          poetry run tscv-features --encoders spec --sliding --win-len 64 --hop 32 --input series.npy --output out_sliding.npz
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          fail_ci_if_error: true
