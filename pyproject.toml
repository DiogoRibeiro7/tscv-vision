[tool.poetry]
name = "tscv-vision"
version = "0.1.1"
description = "Computer-vision feature engineering for 1D time series (NumPy-first)."
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "tscv_vision", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
numpy = ">=1.24"
torch = {version = ">=2.2", optional = true}
fastapi = {version = ">=0.110", optional = true}
prometheus-client = {version = ">=0.20", optional = true}
feast = {version = ">=0.42", optional = true}
scikit-learn = {version = ">=1.3", optional = true}
shap = {version = "*", optional = true}
lime = {version = "*", optional = true}
umap-learn = {version = "*", optional = true}
matplotlib = {version = "*", optional = true}
seaborn = {version = "*", optional = true}
pywavelets = {version = "*", optional = true}
pyyaml = {version = "*", optional = true}
cupy = {version = "*", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=7"
ruff = ">=0.4"
mypy = ">=1.10"
typing-extensions = ">=4.8"
pytest-cov = "^6.2.1"
pre-commit = ">=3.7"

[tool.poetry.scripts]
tscv-features = "tscv_vision.cli:main"

[tool.poetry.extras]
torch = ["torch"]
mlops = ["fastapi", "prometheus-client", "feast"]
analytics = [
    "shap",
    "lime",
    "scikit-learn",
    "umap-learn",
    "matplotlib",
    "seaborn",
    "pywavelets",
]
research = []
domains = ["scikit-learn"]
cli = ["pyyaml"]
gpu = ["cupy"]

[build-system]
requires = ["setuptools>=61", "wheel", "Cython", "numpy"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
src = ["src"]
exclude = ["examples"]

[tool.ruff.lint]
select = ["E","F","I","W","B","UP","NPY"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-m 'not slow and not gpu and not optional'"
markers = [
    "gpu: tests requiring a CUDA GPU and CuPy",
    "slow: slow-running tests",
    "optional: tests that depend on optional packages",
]
